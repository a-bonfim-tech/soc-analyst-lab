title: Run Value Referencing Public Or AppData Executable
id: 21f8abc9-b9ed-5202-82d8-ba960b79ad72
status: experimental
description: Run value references an executable in a user-writable path. Review provenance;
  legitimate updaters can match.
author: SOC Analyst Lab
date: '2026-09-23'
references:
- https://attack.mitre.org/techniques/T1547/001/
logsource:
  product: windows
  category: registry_set
detection:
  selection:
    EventID: 13
    TargetObject|contains: \Software\Microsoft\Windows\CurrentVersion\Run\
    Details|contains:
    - \Users\Public\
    - \AppData\
    Details|endswith:
    - .exe
    - .exe"
  condition: selection
falsepositives:
- Authorized administration or software deployment; validate with asset owner and
  change record.
level: medium
tags:
- attack.persistence
- attack.t1547.001
