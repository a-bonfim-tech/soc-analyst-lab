title: Remote Interactive Privileged Account Outside Approved Sources
id: c006a681-7245-5680-a970-0169da284291
status: experimental
description: Requires explicit asset-context enrichment. Unknown context must not
  be treated as unapproved. This is a contextual candidate for account abuse, not
  proof.
author: SOC Analyst Lab
date: '2026-09-23'
references:
- https://attack.mitre.org/techniques/T1078/
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4624
    LogonType: 10
    PrivilegedAccount: true
    SourceApproved: false
  condition: selection
falsepositives:
- Authorized administration or software deployment; validate with asset owner and
  change record.
level: medium
tags:
- attack.defense_evasion
- attack.t1078
