name: Security & Quality Gate

on:
  push:
    branches:
      - main
      - feature/security-quality-gate
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository-validation:
    name: Repository Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify required SOC Lab directories
        shell: bash
        run: |
          set -euo pipefail

          required_directories=(
            "00-governance"
            "01-runbooks"
            "02-alerts"
            "03-investigations"
            "04-detection-rules"
            "05-threat-intelligence"
            "06-scripts"
            "07-lab"
            "08-tryhackme"
            "09-reports"
            "10-evidence"
          )

          for directory in "${required_directories[@]}"; do
            if [[ ! -d "$directory" ]]; then
              echo "ERROR: Required directory missing: $directory"
              exit 1
            fi
          done

          echo "Repository structure validation passed."
