name: Security & Quality Gate

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository-validation:
    name: Repository Validation
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify required SOC Lab directories
        shell: bash
        run: |
          set -euo pipefail

          required_directories=(
            "00-governance"
            "01-runbooks"
            "02-alerts"
            "03-investigations"
            "04-detection-rules"
            "05-threat-intelligence"
            "06-scripts"
            "07-lab"
            "08-tryhackme"
            "09-reports"
            "10-evidence"
          )

          for directory in "${required_directories[@]}"; do
            if [[ ! -d "$directory" ]]; then
              echo "ERROR: Required directory missing: $directory"
              exit 1
            fi
          done

          echo "Repository structure validation passed."

      - name: Validate YAML syntax
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r -d '' file; do
            echo "Validating YAML: $file"
            ruby -e 'require "yaml"; YAML.load_file(ARGV[0])' "$file"
          done < <(
            find . \
              -type f \
              \( -name "*.yml" -o -name "*.yaml" \) \
              -not -path "./.git/*" \
              -print0
          )

          echo "YAML syntax validation passed."

      - name: Validate Sigma rules
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet pysigma
          python 06-scripts/validate_sigma.py

      - name: Validate Bash syntax
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r -d '' file; do
            echo "Validating Bash syntax: $file"
            bash -n "$file"
          done < <(
            find . \
              -type f \
              -name "*.sh" \
              -not -path "./.git/*" \
              -print0
          )

          echo "Bash syntax validation passed."

      - name: Run detection engineering tests
        shell: bash
        run: |
          set -euo pipefail

          test_count=0

          while IFS= read -r -d '' test_script; do
            test_count=$((test_count + 1))
            echo "Running detection test: $test_script"
            bash "$test_script"
          done < <(
            find 07-lab/detection-tests \
              -type f \
              -name "test.sh" \
              -print0
          )

          if [[ "$test_count" -eq 0 ]]; then
            echo "ERROR: No detection engineering tests found."
            exit 1
          fi

          echo "Detection engineering tests passed: $test_count test(s)."
